<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Index Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="form-grid">
        <div class="form-group">
            <label for="city">City</label>
            <select id="city" required>
                <option value="" disabled selected>Select a city</option>
                {% for city in cities %}
                <option value="{{ city }}">{{ city }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="date">Observation Date</label>
            <input type="date" id="date" required>
        </div>
    </div>

    <div class="container">
        <header>
            <h1></h1>AQI Forecaster</h1>
            <p>Predict Air Quality Index instantly using our Random Forest Model.</p>
        </header>

        <div class="dashboard">
            <div class="input-panel">
                <h2>Enter Measurements</h2>
                <form id="aqi-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <select id="city" required>
                                <option value="" disabled selected>Select a city</option>
                                {% for city in cities %}
                                <option value="{{ city }}">{{ city }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">Observation Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="pollutant-grid">
                        <div class="form-group">
                            <label for="pm25">PM2.5</label>
                            <input type="number" id="pm25" step="0.01" placeholder="e.g. 50.5" required>
                        </div>
                        <div class="form-group">
                            <label for="pm10">PM10</label>
                            <input type="number" id="pm10" step="0.01" placeholder="e.g. 100.2" required>
                        </div>
                        <div class="form-group">
                            <label for="no2">NO2</label>
                            <input type="number" id="no2" step="0.01" placeholder="e.g. 45.0" required>
                        </div>
                        <div class="form-group">
                            <label for="co">CO</label>
                            <input type="number" id="co" step="0.01" placeholder="e.g. 1.2" required>
                        </div>
                        <div class="form-group">
                            <label for="so2">SO2</label>
                            <input type="number" id="so2" step="0.01" placeholder="e.g. 15.0" required>
                        </div>
                        <div class="form-group">
                            <label for="o3">O3</label>
                            <input type="number" id="o3" step="0.01" placeholder="e.g. 55.0" required>
                        </div>
                    </div>

                    <button type="submit" class="predict-btn" id="predictBtn">
                        <span>Predict AQI</span>
                        <div class="spinner" id="spinner" style="display: none;"></div>
                    </button>
                    <div id="error-message" class="error-banner" style="display: none;"></div>
                </form>
            </div>

            <div class="result-panel" id="resultPanel">
                <h2>Prediction</h2>
                <div class="aqi-ring-container">
                    <div class="aqi-ring" id="aqiRing">
                        <div class="aqi-value" id="aqiValue">--</div>
                    </div>
                </div>
                <div class="aqi-category" id="aqiCategory">Waiting for input...</div>
                <p class="helper-text">Enter pollutant data and hit predict to see results.</p>
            </div>
        </div>
    </div>

    <script>
        // Set today's date automatically
        document.getElementById('date').valueAsDate = new Date();

        const form = document.getElementById('aqi-form');
        const predictBtn = document.getElementById('predictBtn');
        const spinner = document.getElementById('spinner');
        const resultPanel = document.getElementById('resultPanel');
        const aqiValue = document.getElementById('aqiValue');
        const aqiRing = document.getElementById('aqiRing');
        const aqiCategory = document.getElementById('aqiCategory');
        const errorMsg = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Loading state
            predictBtn.classList.add('loading');
            spinner.style.display = 'block';
            errorMsg.style.display = 'none';
            resultPanel.style.transform = 'scale(0.98)';

            const payload = {
                City: document.getElementById('city').value,
                Date: document.getElementById('date').value,
                'PM2.5': parseFloat(document.getElementById('pm25').value),
                PM10: parseFloat(document.getElementById('pm10').value),
                NO2: parseFloat(document.getElementById('no2').value),
                CO: parseFloat(document.getElementById('co').value),
                SO2: parseFloat(document.getElementById('so2').value),
                O3: parseFloat(document.getElementById('o3').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    // Animate the result
                    aqiValue.textContent = data.aqi;
                    aqiCategory.textContent = data.category;
                    aqiRing.style.borderColor = data.color;
                    aqiValue.style.color = data.color;

                    // Subtle pop animation
                    setTimeout(() => {
                        resultPanel.style.transform = 'scale(1.02)';
                        setTimeout(() => resultPanel.style.transform = 'scale(1)', 150);
                    }, 50);
                } else {
                    showError(data.error || "An unknown error occurred.");
                }
            } catch (error) {
                showError("Connection failed. Ensure server is running.");
            } finally {
                predictBtn.classList.remove('loading');
                spinner.style.display = 'none';
            }
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }
    </script>
</body>

</html>
